<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create a SafeMind Account | AI Scam Protection</title>
	<meta name="description" content="Create a SafeMind account to investigate suspicious content, save scam reports, and receive bilingual AI-powered safety guidance.">
	<meta name="robots" content="noindex,follow">
	<link rel="icon" href="/favicon.ico?v=green-20260717" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=green-20260717">
	<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=green-20260717">
	<link rel="manifest" href="/manifest.webmanifest">
	<meta name="theme-color" content="#5A5D7A">
<script src="/theme-init.js"></script>
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="SafeMind">
	<link rel="stylesheet" href="/src/css/auth.css">
	<link rel="stylesheet" href="/src/css/theme.css">
	<link rel="stylesheet" href="/src/css/brand-palette.css">
</head>
<body class="auth-page" data-auth-page="signup">
	<main class="auth-shell">
		<section class="auth-card">
			<a href="/" class="auth-card-brand" data-logo-link aria-label="SafeMind home"><img src="/assets/green-wordmark.png" alt="SafeMind"></a>
			<h1>Sign up</h1>
			<p class="subcopy">Create a new workspace with email, Google or Microsoft.</p>

			<form class="auth-form" data-auth-form novalidate>
				<label for="newEmail">Email</label>
				<input id="newEmail" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>

				<label for="newPassword">Password</label>
				<input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters" required aria-describedby="passwordGuidance">
				<p id="passwordGuidance" class="field-guidance">Use 12 or more characters with upper and lowercase letters, a number, and a symbol.</p>

				<button type="submit" class="auth-button" data-input-action disabled>Create account</button>

				<div class="auth-divider">or continue with</div>

				<div class="auth-social">
					<button type="button" class="auth-social-button google" data-provider="google">Continue with Google</button>
					<button type="button" class="auth-social-button microsoft" data-provider="azure">Continue with Microsoft</button>
				</div>

				<p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
				<p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
			</form>
		</section>
	</main>

	<script type="module" src="/src/js/auth.js"></script>
</body>
</html>
