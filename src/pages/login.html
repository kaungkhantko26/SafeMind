<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log In to SafeMind | AI Scam Detection Dashboard</title>
	<meta name="description" content="Log in to SafeMind to investigate suspicious content, review scam reports, and access bilingual AI-powered online safety guidance.">
	<meta name="robots" content="noindex,follow">
	<link rel="icon" href="/favicon.ico?v=green-20260717" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=green-20260717">
	<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=green-20260717">
	<link rel="manifest" href="/manifest.webmanifest">
	<meta name="theme-color" content="#5A5D7A">
<script src="/theme-init.js"></script>
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="SafeMind">
	<link rel="stylesheet" href="/src/css/auth.css">
	<link rel="stylesheet" href="/src/css/theme.css">
	<link rel="stylesheet" href="/src/css/brand-palette.css">
</head>
<body class="auth-page" data-auth-page="login">
	<main class="auth-shell">
		<section class="auth-card">
			<a href="/" class="auth-card-brand" data-logo-link aria-label="SafeMind home"><img src="/assets/green-wordmark.png" alt="SafeMind"></a>
			<h1>Login</h1>
			<p class="subcopy">Use your email account or continue with a social provider.</p>

			<form class="auth-form" data-auth-form novalidate>
				<label for="email">Email</label>
				<input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>

				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="Your password" required>

				<button type="submit" class="auth-button" data-input-action disabled>Login</button>

				<div class="auth-divider">or continue with</div>

				<div class="auth-social">
					<button type="button" class="auth-social-button google" data-provider="google">Continue with Google</button>
					<button type="button" class="auth-social-button microsoft" data-provider="azure">Continue with Microsoft</button>
				</div>

				<p class="auth-footer">Don't have an account? <a href="/signup">Create one</a></p>
				<p class="auth-message" data-auth-message role="status" aria-live="polite"></p>
			</form>
		</section>
	</main>

	<script type="module" src="/src/js/auth.js"></script>
</body>
</html>
