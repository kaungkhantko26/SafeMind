<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeMind Setting</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="/favicon.ico?v=green-20260717" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=green-20260717">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=green-20260717">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#5A5D7A">
<script src="/theme-init.js"></script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SafeMind">
    <link rel="stylesheet" href="/src/css/dashboard.css">
    <link rel="stylesheet" href="/src/css/brand-palette.css">
</head>
<body class="dashboard-page" data-page="profile">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="https://safemind.kaungkhantko.studio/"><img src="/assets/green-logo.png" alt="" aria-hidden="true"><span>SafeMind</span></a>
            <nav class="dashboard-nav" aria-label="Primary navigation">
                <a class="nav-link" href="/dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1Z"/></svg><span>Overview</span></a>
                <a class="nav-link" href="/reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg><span>Reports</span></a>
                <a class="nav-link" href="/eduai"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-5 9 5-9 5Z"/><path d="M7 12v4c2.8 2.1 7.2 2.1 10 0v-4M21 9v6"/><path d="m19 2 .55 1.45L21 4l-1.45.55L19 6l-.55-1.45L17 4l1.45-.55Z"/></svg><span>EduAI</span></a>
                <a class="nav-link is-active" href="/settings" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-7-7"/></svg><span>Setting</span></a>
            </nav>
            <button class="mobile-nav-more" type="button" aria-expanded="false" aria-controls="dashboardUtilities" aria-label="More options"><span></span><span></span><span></span></button>
            <div class="dashboard-utilities" id="dashboardUtilities">
                <button class="sidebar-control language-toggle" type="button" data-language-toggle>မြန်မာ</button>
                <button class="sidebar-control logout-control" type="button" data-logout><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m5-4 4-4-4-4m4 4H9"/></svg><span>Logout</span></button>
            </div>
        </aside>
        <div class="dashboard-main">
            <header class="dashboard-header"><div><p>Account</p><h1>Edit profile</h1></div><a class="profile-link is-current" href="/settings" aria-current="page"><span class="avatar" data-avatar>SM</span><span><b class="username">User</b><small>Profile</small></span></a></header>
            <main class="dashboard-content narrow-content">
                <section class="content-card profile-card">
                    <div class="profile-avatar-large avatar" data-avatar>SM</div>
                    <form class="dashboard-form" id="profileForm">
                        <label for="profileName">Display name</label><input id="profileName" type="text" maxlength="80" autocomplete="name" required>
                        <label for="profileEmail">Email address</label><input id="profileEmail" type="email" readonly>
                        <button class="primary-button" type="submit" id="profileSubmit" data-input-action disabled>Save profile</button><p class="form-status" id="profileStatus" role="status" aria-live="polite"></p>
                    </form>
                </section>
                <section class="content-card" id="settings">
                    <div class="section-title"><div><p>Security</p><h2>Change password</h2></div></div>
                    <form class="dashboard-form" id="passwordForm">
                        <label for="profileCurrentPassword">Current password</label><input id="profileCurrentPassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
                        <label for="profilePassword">New password</label><input id="profilePassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="passwordGuidance" required>
                        <small class="form-guidance" id="passwordGuidance">Use at least 12 characters with upper and lowercase letters, a number, and a symbol.</small>
                        <label for="profilePasswordConfirm">Confirm new password</label><input id="profilePasswordConfirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
                        <button class="primary-button" type="submit" id="passwordSubmit" data-input-action disabled>Update password</button><p class="form-status" id="passwordStatus" role="status" aria-live="polite"></p>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/src/js/dashboard.js"></script>
</body>
</html>
